name: Deploy to home test Pi

on:
  push:
    branches:
      - deploy-test

jobs:
  deploy:
    runs-on: [self-hosted, home-pi]
    steps:
      # Deliberately not using actions/checkout: it checks out into the
      # runner's own _work directory, but the systemd unit (installed by
      # scripts/bootstrap-host.sh) points at the fixed ~/sch-screen-man
      # clone. Sync that same directory instead so the service actually
      # serves what this job builds.
      - name: Sync repo and deploy
        run: |
          cd "$HOME/sch-screen-man"
          git fetch origin deploy-test
          git checkout deploy-test
          git reset --hard origin/deploy-test
          ./scripts/deploy.sh
